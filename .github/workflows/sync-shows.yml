name: Auto-Sync Shows from St. Marks & Eventbrite

on:
  schedule:
    # Runs daily at 08:00 UTC (4:00 AM EDT)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI or CLI

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Show Sync Script
        run: node scripts/sync-shows.js

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/shows.js
          if git diff --staged --quiet; then
            echo "No show changes detected. Skipping commit."
          else
            git commit -m "Automated daily sync: Update show schedule from live St. Marks database"
            git push origin main
          fi
