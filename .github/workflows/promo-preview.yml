name: Promo Kit Generator (Dry Run / Safe Preview)

on:
  workflow_dispatch: # Manual trigger only via GitHub UI or CLI

permissions:
  contents: write

jobs:
  generate-promo-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Promo Engine in Dry Run Mode
        env:
          DRY_RUN: 'true'
        run: node scripts/promo-engine.js

      - name: Upload Promo Preview Artifact
        uses: actions/upload-artifact@v4
        with:
          name: promo-kit-preview
          path: promo-preview.md
